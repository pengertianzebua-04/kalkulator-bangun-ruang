<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Bangun Ruang</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#243247}header{background:#245a81;color:white;text-align:center;padding:25px 16px}header h1{margin:0 0 8px;font-size:28px}header p{margin:0}main{max-width:900px;margin:25px auto;padding:0 16px}.panel{background:white;padding:22px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.08);margin-bottom:18px}label{display:block;font-weight:bold;margin:14px 0 6px}select,input{width:100%;padding:11px;border:1px solid #bdc9d6;border-radius:7px;font-size:16px;background:white}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}button{border:0;background:#245a81;color:white;padding:12px 18px;border-radius:7px;font-size:16px;cursor:pointer;margin:18px 8px 0 0}button:hover{background:#174364}button.secondary{background:#64748b}.result{background:#f1f8ff;border-left:5px solid #245a81;border-radius:7px;padding:16px;min-height:60px;line-height:1.7}.formula{color:#536579;font-size:14px}footer{text-align:center;color:#64748b;padding:10px 16px 25px;font-size:14px}@media(max-width:600px){.fields{grid-template-columns:1fr}header h1{font-size:23px}}
</style></head><body>
<header><h1>Kalkulator Bangun Ruang</h1><p>Aplikasi sederhana menghitung volume bangun ruang</p></header>
<main><section class="panel"><h2>Masukkan Data Bangun Ruang</h2><label for="bangun">Pilih bangun ruang</label><select id="bangun" onchange="tampilkanInput()"><option value="kubus">Kubus</option><option value="balok">Balok</option><option value="tabung">Tabung</option><option value="kerucut">Kerucut</option><option value="bola">Bola</option><option value="prisma">Prisma Segitiga</option><option value="limas">Limas Segiempat</option><option value="setengahbola">Setengah Bola</option></select><div id="inputBangun" class="fields"></div><p id="rumus" class="formula"></p><button onclick="hitungVolume()">Hitung Volume</button><button class="secondary" onclick="resetForm()">Reset</button></section><section class="panel"><h2>Hasil Perhitungan</h2><div id="hasil" class="result">Hasil perhitungan akan muncul di sini.</div></section></main><footer>Tugas Kelompok JavaScript + HTML — Mini Project Bangun Ruang</footer>
<script>
const dataBangun={
kubus:{nama:"Kubus",rumus:"Rumus volume: sisi × sisi × sisi",input:[{id:"sisi",label:"Panjang sisi",placeholder:"Masukkan panjang sisi"}]},
balok:{nama:"Balok",rumus:"Rumus volume: panjang × lebar × tinggi",input:[{id:"panjang",label:"Panjang",placeholder:"Masukkan panjang"},{id:"lebar",label:"Lebar",placeholder:"Masukkan lebar"},{id:"tinggi",label:"Tinggi",placeholder:"Masukkan tinggi"}]},
tabung:{nama:"Tabung",rumus:"Rumus volume: π × jari-jari² × tinggi",input:[{id:"jari",label:"Jari-jari",placeholder:"Masukkan jari-jari"},{id:"tinggi",label:"Tinggi",placeholder:"Masukkan tinggi"}]},
kerucut:{nama:"Kerucut",rumus:"Rumus volume: ⅓ × π × jari-jari² × tinggi",input:[{id:"jari",label:"Jari-jari",placeholder:"Masukkan jari-jari"},{id:"tinggi",label:"Tinggi",placeholder:"Masukkan tinggi"}]},
bola:{nama:"Bola",rumus:"Rumus volume: ⁴⁄₃ × π × jari-jari³",input:[{id:"jari",label:"Jari-jari",placeholder:"Masukkan jari-jari"}]},
prisma:{nama:"Prisma Segitiga",rumus:"Rumus volume: (½ × alas segitiga × tinggi segitiga) × tinggi prisma",input:[{id:"alas",label:"Alas segitiga",placeholder:"Masukkan alas segitiga"},{id:"tinggiSegitiga",label:"Tinggi segitiga",placeholder:"Masukkan tinggi segitiga"},{id:"tinggiPrisma",label:"Tinggi prisma",placeholder:"Masukkan tinggi prisma"}]},
limas:{nama:"Limas Segiempat",rumus:"Rumus volume: ⅓ × luas alas × tinggi (alas berbentuk persegi)",input:[{id:"sisiAlas",label:"Panjang sisi alas persegi",placeholder:"Masukkan sisi alas"},{id:"tinggi",label:"Tinggi limas",placeholder:"Masukkan tinggi limas"}]},
setengahbola:{nama:"Setengah Bola",rumus:"Rumus volume: ½ × ⁴⁄₃ × π × jari-jari³",input:[{id:"jari",label:"Jari-jari",placeholder:"Masukkan jari-jari"}]}};
function tampilkanInput(){const data=dataBangun[document.getElementById("bangun").value],wadah=document.getElementById("inputBangun");wadah.innerHTML="";data.input.forEach(item=>{const div=document.createElement("div"),label=document.createElement("label"),input=document.createElement("input");label.htmlFor=item.id;label.textContent=item.label;input.type="number";input.id=item.id;input.min="0";input.step="any";input.placeholder=item.placeholder;div.append(label,input);wadah.appendChild(div)});document.getElementById("rumus").textContent=data.rumus;document.getElementById("hasil").textContent="Hasil perhitungan akan muncul di sini."}
function ambilAngka(id){return Number(document.getElementById(id).value)}
function hitungVolume(){const pilihan=document.getElementById("bangun").value,nama=dataBangun[pilihan].nama;for(const item of dataBangun[pilihan].input){const input=document.getElementById(item.id);if(input.value===""||Number(input.value)<=0){alert("Mohon isi semua ukuran dengan angka lebih dari 0.");input.focus();return}}const pi=Math.PI;let volume=0,perhitungan="";switch(pilihan){case"kubus":{const s=ambilAngka("sisi");volume=s**3;perhitungan=`${s} × ${s} × ${s}`;break}case"balok":{const p=ambilAngka("panjang"),l=ambilAngka("lebar"),t=ambilAngka("tinggi");volume=p*l*t;perhitungan=`${p} × ${l} × ${t}`;break}case"tabung":{const r=ambilAngka("jari"),t=ambilAngka("tinggi");volume=pi*r*r*t;perhitungan=`π × ${r} × ${r} × ${t}`;break}case"kerucut":{const r=ambilAngka("jari"),t=ambilAngka("tinggi");volume=pi*r*r*t/3;perhitungan=`⅓ × π × ${r} × ${r} × ${t}`;break}case"bola":{const r=ambilAngka("jari");volume=4/3*pi*r**3;perhitungan=`⁴⁄₃ × π × ${r} × ${r} × ${r}`;break}case"prisma":{const a=ambilAngka("alas"),ts=ambilAngka("tinggiSegitiga"),tp=ambilAngka("tinggiPrisma");volume=.5*a*ts*tp;perhitungan=`(½ × ${a} × ${ts}) × ${tp}`;break}case"limas":{const s=ambilAngka("sisiAlas"),t=ambilAngka("tinggi");volume=s*s*t/3;perhitungan=`⅓ × (${s} × ${s}) × ${t}`;break}case"setengahbola":{const r=ambilAngka("jari");volume=2/3*pi*r**3;perhitungan=`½ × ⁴⁄₃ × π × ${r} × ${r} × ${r}`;break}}const hasil=volume.toLocaleString("id-ID",{maximumFractionDigits:3}),pesan=`Bangun ruang: ${nama}\nPerhitungan: ${perhitungan}\nVolume: ${hasil} satuan³`;document.getElementById("hasil").innerHTML=`<strong>Bangun ruang:</strong> ${nama}<br><strong>Perhitungan:</strong> ${perhitungan}<br><strong>Volume:</strong> ${hasil} satuan³`;alert(pesan)}function resetForm(){tampilkanInput()}tampilkanInput();
</script></body></html>
